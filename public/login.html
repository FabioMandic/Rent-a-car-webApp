<!DOCTYPE html>
<html lang="en">
<head>

    <title>Login</title>
    <link rel="stylesheet" href="styles/register.css">
    <script src="scripts/login.js" defer></script>
</head>
<body>
    <form id="loginForm">
        <h2>Login</h2>

        <p>Nemate račun? <a href="register.html">Izradite korisnički račun</a></p>
    </form>
</body>
</html>
