<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moje Rezervacije - Rent a Car</title>
  <link rel="stylesheet" href="./styles/pocetna.css" />
  <link rel="stylesheet" href="./styles/vozila.css" />
  <link rel="stylesheet" href="./styles/rezervacije-user.css" />
  <script src="./scripts/session.js" defer></script>
  <script src="./scripts/rezervacije-user.js" defer></script>
</head>

<body>
  <div class="container">
    <img src="./images/background-home.png.png" alt="Background" class="background-image" />

    
    <header class="navbar">
      <div class="nav-left">
        <div class="dropdown" id="userDropdown" style="display: none;">
          <button class="dropbtn" id="welcomeUser">WELCOME, "USERNAME"</button>
          <div class="dropdown-content" id="dropdown-content"></div>
        </div>
        <div class="logo" id="brandLogo">
          <img src="./images/icon-home.png.png" alt="Car Icon" />
          <span>RENT A CAR</span>
        </div>
      </div>

      <div class="nav-center">
        <a href="rezervacije.html" id="rezervacijeBtn" class="btn rezervacije-btn" style="display: none;">REZERVACIJE</a>
        <a href="pocetna.html" class="nav-link">POČETNA</a>
        <a href="o-nama.html" class="nav-link">O NAMA</a>
        <a href="lokacije.html" class="nav-link">LOKACIJE</a>
        <a href="vozila.html" class="nav-link">VOZILA</a>
      </div>

      <div class="auth-buttons">
        <a href="login.html" class="btn login" id="loginBtn">LOGIN</a>
        <a href="register.html" class="btn register" id="registerBtn">REGISTER</a>
        <a href="#" class="btn logout" id="logoutBtn" style="display: none;">LOGOUT</a>
      </div>
    </header>

    <main class="main-area">
      <div id="userReservationsContainer" class="cards-container" style="margin-top: 30px;">
        <!-- Dinamički prikaz svih rezervacija korisnika -->
      </div>
    </main>
  </div>

  <div id="deleteModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalSubtitle">
      <h3 id="modalTitle" style="text-align:center; text-decoration: underline; margin-bottom: 6px;">
        Brisanje rezervacije
      </h3>
      <p id="modalSubtitle" class="modal-subtitle" style="text-align:center;">
      </p>
      <div class="modal-actions">
        <button id="confirmDelete" class="btn btn-confirm">Potvrdi</button>
        <button id="cancelDelete" class="btn btn-cancel">Odbij</button>
      </div>
    </div>
  </div>
</body>
</html>
