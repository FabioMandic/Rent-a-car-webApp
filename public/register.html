<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registracija</title>
    <link rel="stylesheet" href="styles/register.css">
    <script src="scripts/register.js" defer></script>
</head>
<body>
    <form id="registerForm">
        <h2>Registracija</h2>
        <input type="text" id="username" placeholder="Korisničko ime" required><br>
        <input type="email" id="email" placeholder="Email" required><br>
        <input type="password" id="password" placeholder="Lozinka" required><br>
        <input type="password" id="confirmPassword" placeholder="Potvrdi lozinku" required><br>
        <button type="submit">Registriraj se</button>
        <p>Već imate račun? <a href="login.html">Prijavite se</a></p>
    </form>
</body>
</html>
